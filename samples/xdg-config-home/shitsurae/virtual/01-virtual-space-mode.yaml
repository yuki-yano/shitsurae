# arrange command: shitsurae arrange virtualWork --dry-run --json
# bootstrap command: shitsurae arrange virtualWork --state-only --space 1 --json
# expected exit code: 0
# v2: mode.space is gone - Shitsurae always manages virtual workspaces.

shortcuts:
  moveCurrentWindowToSpace:
    - slot: 1
      key: "1"
      modifiers: [alt]
    - slot: 2
      key: "2"
      modifiers: [alt]
  switchVirtualSpace:
    - slot: 1
      key: "1"
      modifiers: [ctrl]
    - slot: 2
      key: "2"
      modifiers: [ctrl]

layouts:
  virtualWork:
    initialFocus:
      slot: 1
    display:
      monitor: primary
    spaces:
      - spaceID: 1
        windows:
          - slot: 1
            launch: false
            match:
              bundleID: com.apple.TextEdit
            frame:
              x: "0%"
              y: "0%"
              width: "50%"
              height: "100%"
          - slot: 2
            launch: false
            match:
              bundleID: com.apple.Terminal
            frame:
              x: "50%"
              y: "0%"
              width: "50%"
              height: "100%"
      - spaceID: 2
        windows:
          - slot: 1
            launch: false
            match:
              bundleID: com.apple.Notes
            frame:
              x: "0%"
              y: "0%"
              width: "50%"
              height: "100%"
          - slot: 2
            launch: false
            match:
              bundleID: com.apple.Calendar
            frame:
              x: "50%"
              y: "0%"
              width: "50%"
              height: "100%"

  # A single-space layout hosted on the secondary display: effectively an
  # always-visible pinned surface, independent from virtualWork's switching.
  # Keep secondary-hosted matchers narrow (dedicated bundleID or a
  # title/profile discriminator) so primary-display windows stay adoptable.
  pinnedDashboard:
    display:
      monitor: secondary
    spaces:
      - spaceID: 1
        windows:
          - slot: 1
            launch: false
            match:
              bundleID: com.apple.Stickies
            frame:
              x: "0%"
              y: "0%"
              width: "100%"
              height: "100%"
